<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title>

<style>
body{
    margin:0;
    padding:12px;
    background:#eef3f8;
    font-family:Segoe UI,Arial,sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    background:#003b7a;
    color:white;
    border-radius:18px;
    padding:20px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:900;
}

.counter{
    margin-top:10px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-top:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.bigBtn{
    width:100%;
    background:#0078d4;
    color:white;
    border:none;
    border-radius:16px;
    padding:24px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
    display:block;
    text-align:center;
    box-sizing:border-box;
}

.blue{
    background:#0078d4;
}

.green{
    background:#107c10;
}

.red{
    background:#c50f1f;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
}

canvas{
    border:2px solid #ccc;
    border-radius:10px;
    width:100%;
    height:180px;
    touch-action:none;
}

.thumb{
    width:100%;
    border-radius:10px;
    margin-top:8px;
}

.record img{
    width:100%;
    border-radius:10px;
    margin-top:8px;
}

.actions{
    margin-top:10px;
}

details{
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    background:white;
}

summary{
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">SYNTEGON</div>
<div>TRANSPORTE INTERNO TELSTAR</div>

<div id="contador" class="counter">
Registros hoy: 0
</div>
</div>

<div class="card">

<button class="bigBtn" onclick="mostrarFormulario()">
📷 NUEVO REGISTRO
</button>

<div id="formulario" style="display:none;margin-top:15px;">

<label><b>Proveedor / Cliente</b></label>
<input id="cliente" placeholder="Escribir nombre">

<h3>Firma</h3>

<canvas id="firma"></canvas>

<button class="btn red" onclick="limpiarFirma()">
Borrar firma
</button>

<label for="fotoInput" class="btn blue">
📷 HACER FOTO
</label>

<input
type="file"
id="fotoInput"
accept="image/*"
capture="environment"
style="display:none"
>

<div id="previewFotos"></div>

<button
class="btn green"
onclick="guardarRegistro()">
✅ GUARDAR REGISTRO
</button>

</div>

</div>

<div class="card">

<h2>Historial de registros</h2>

<div id="historial"></div>

</div>

</div>

<script>

let fotos = [];

function mostrarFormulario(){
    document.getElementById("formulario").style.display="block";
}

const canvas = document.getElementById("firma");
const ctx = canvas.getContext("2d");

function ajustarCanvas(){
    canvas.width = canvas.offsetWidth;
    canvas.height = 180;
}

ajustarCanvas();
window.addEventListener("resize", ajustarCanvas);

let dibujando = false;

function getPos(e){

    const rect = canvas.getBoundingClientRect();

    if(e.touches){
        return {
            x:e.touches[0].clientX - rect.left,
            y:e.touches[0].clientY - rect.top
        };
    }

    return {
        x:e.clientX - rect.left,
        y:e.clientY - rect.top
    };
}

function iniciar(e){
    dibujando = true;

    const p = getPos(e);

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
}

function mover(e){

    if(!dibujando) return;

    const p = getPos(e);

    ctx.lineTo(p.x,p.y);
    ctx.stroke();
}

function parar(){
    dibujando = false;
}

canvas.addEventListener("mousedown", iniciar);
canvas.addEventListener("mousemove", mover);
window.addEventListener("mouseup", parar);

canvas.addEventListener("touchstart", iniciar);
canvas.addEventListener("touchmove", mover);
canvas.addEventListener("touchend", parar);

function limpiarFirma(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
}

document
.getElementById("fotoInput")
.addEventListener("change", function(e){

    const archivo = e.target.files[0];

    if(!archivo) return;

    const reader = new FileReader();

    reader.onload = function(ev){

        fotos.push(ev.target.result);

        renderFotos();
    }

    reader.readAsDataURL(archivo);

    e.target.value="";
});

function renderFotos(){

    const div = document.getElementById("previewFotos");

    div.innerHTML="";

    fotos.forEach((foto,index)=>{

        div.innerHTML += `

        <div style="margin-top:10px">

        <img class="thumb" src="${foto}">

        <button
        class="btn red"
        onclick="eliminarFoto(${index})">

        🗑 Eliminar foto

        </button>

        </div>

        `;
    });
}

function eliminarFoto(index){

    fotos.splice(index,1);

    renderFotos();
}

function guardarRegistro(){

    const cliente =
    document.getElementById("cliente").value.trim();

    if(cliente===""){
        alert("Introduce Cliente / Proveedor");
        return;
    }

    if(fotos.length===0){
        alert("Debes añadir al menos una foto");
        return;
    }

    const ahora = new Date();

    const registro = {

        cliente:cliente,

        fecha:
        ahora.toLocaleDateString("es-ES"),

        hora:
        ahora.toLocaleTimeString("es-ES"),

        firma:
        canvas.toDataURL("image/png"),

        fotos:[...fotos]
    };

    const registros =
    JSON.parse(
        localStorage.getItem("registrosTransporte")
        || "[]"
    );

    registros.push(registro);

    localStorage.setItem(
        "registrosTransporte",
        JSON.stringify(registros)
    );

    document.getElementById("cliente").value="";

    fotos=[];

    renderFotos();

    limpiarFirma();

    cargarHistorial();

    alert("✅ Registro guardado correctamente");
}

function borrarRegistro(index){

    if(!confirm("¿Borrar registro?")) return;

    const registros =
    JSON.parse(
        localStorage.getItem("registrosTransporte")
        || "[]"
    );

    registros.splice(index,1);

    localStorage.setItem(
        "registrosTransporte",
        JSON.stringify(registros)
    );

    cargarHistorial();
}

function cargarHistorial(){

    const registros =
    JSON.parse(
        localStorage.getItem("registrosTransporte")
        || "[]"
    );

    const historial =
    document.getElementById("historial");

    historial.innerHTML="";

    const hoy =
    new Date().toLocaleDateString("es-ES");

    document.getElementById("contador").innerText =
        "Registros hoy: " +
        registros.filter(
            r => r.fecha===hoy
        ).length;

    registros
    .slice()
    .reverse()
    .forEach((r,idx)=>{

        const realIndex =
        registros.length - 1 - idx;

        historial.innerHTML += `

        <details>

        <summary>
        ${r.fecha} ${r.hora} - ${r.cliente}
        </summary>

        <div class="record">

        <p><b>Cliente / Proveedor:</b> ${r.cliente}</p>

        <p><b>Firma:</b></p>
        <img src="${r.firma}">

        <p><b>Fotos:</b></p>

        ${r.fotos.map(
            f => `<img src="${f}">`
        ).join("")}

        <div class="actions">

        <button
        class="btn red"
        onclick="borrarRegistro(${realIndex})">

        🗑 Borrar registro

        </button>

        </div>

        </div>

        </details>

        `;
    });
}

cargarHistorial();

</script>

</body>
</html>
