<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title><style>body{margin:0;padding:12px;background:#eef3f8;font-family:Segoe UI,Arial} .container{max-width:900px;margin:auto}.header{background:#003b7a;color:#fff;border-radius:18px;padding:20px;text-align:center}.logo{font-size:34px;font-weight:900}.card{background:#fff;border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}.big{width:100%;padding:22px;background:#0078d4;color:#fff;border:none;border-radius:16px;font-size:24px;font-weight:700}.btn{display:block;width:100%;padding:14px;border-radius:12px;text-align:center;color:#fff;font-weight:700;margin-top:8px;text-decoration:none;border:none}.blue{background:#0078d4}.green{background:#107c10}.red{background:#c50f1f}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}canvas{border:2px solid #ccc;border-radius:10px;width:100%;height:180px;touch-action:none}img{max-width:100%;border-radius:10px;margin-top:8px}details{margin-top:10px;border:1px solid #ddd;border-radius:10px;padding:10px}</style></head><body><div class="container"><div class="header"><div class="logo">SYNTEGON</div><div>TRANSPORTE INTERNO TELSTAR</div><div id="contador">Registros hoy: 0</div></div><div class="card"><button class="big" onclick="mostrar()">📷 NUEVO REGISTRO</button><div id="form" style="display:none;margin-top:12px"><input id="cliente" placeholder="Proveedor / Cliente"><h3>Firma</h3><canvas id="firma"></canvas><button class="btn red" onclick="limpiarFirma()">Borrar firma</button><label for="fotoInput" class="btn blue">📷 HACER FOTO</label><input id="fotoInput" type="file" accept="image/*" capture="environment"><div id="preview"></div><button class="btn green" onclick="guardarRegistro()">✅ GUARDAR REGISTRO</button></div></div><div class="card"><h3>Historial</h3><div id="historial"></div></div></div><script>let fotos=[];function mostrar(){document.getElementById('form').style.display='block'}const canvas=document.getElementById('firma');const ctx=canvas.getContext('2d');function resize(){canvas.width=canvas.offsetWidth;canvas.height=180}resize();let draw=false;function p(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}canvas.onmousedown=e=>{draw=true;let a=p(e);ctx.beginPath();ctx.moveTo(a.x,a.y)};canvas.onmousemove=e=>{if(!draw)return;let a=p(e);ctx.lineTo(a.x,a.y);ctx.stroke()};window.onmouseup=()=>draw=false;canvas.ontouchstart=e=>{draw=true;let a=p(e);ctx.beginPath();ctx.moveTo(a.x,a.y)};canvas.ontouchmove=e=>{if(!draw)return;let a=p(e);ctx.lineTo(a.x,a.y);ctx.stroke()};canvas.ontouchend=()=>draw=false;function limpiarFirma(){ctx.clearRect(0,0,canvas.width,canvas.height)}document.getElementById('fotoInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{fotos.push(x.target.result);renderFotos()};r.readAsDataURL(f);e.target.value=''});function renderFotos(){document.getElementById('preview').innerHTML=fotos.map(f=>'<img src="'+f+'">').join('')}function guardarRegistro(){const regs=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');const d=new Date();regs.push({cliente:document.getElementById('cliente').value,fecha:d.toLocaleDateString('es-ES'),hora:d.toLocaleTimeString('es-ES'),firma:canvas.toDataURL(),fotos:[...fotos]});localStorage.setItem('registrosTransporte',JSON.stringify(regs));document.getElementById('cliente').value='';fotos=[];renderFotos();limpiarFirma();cargar();alert('Registro guardado')}function borrar(i){let r=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');r.splice(i,1);localStorage.setItem('registrosTransporte',JSON.stringify(r));cargar()}function cargar(){const r=JSON.parse(localStorage.getItem('registrosTransporte')||'[]');document.getElementById('contador').innerText='Registros hoy: '+r.filter(x=>x.fecha===new Date().toLocaleDateString('es-ES')).length;const h=document.getElementById('historial');h.innerHTML='';r.slice().reverse().forEach((x,n)=>{const i=r.length-1-n;h.innerHTML+=`<details><summary>${x.fecha} ${x.hora} - ${x.cliente||'Sin nombre'}</summary><p><b>Cliente:</b> ${x.cliente||''}</p><img src='${x.firma}'>${(x.fotos||[]).map(f=>`<img src='${f}'>`).join('')}<button class='btn red' onclick='borrar(${i})'>🗑 Borrar</button></details>`})}cargar();</script></body></html>
