<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRANSPORTE INTERNO - TELSTAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef3f8;
      color: #1b2430;
    }
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 12px 20px 12px;
    }
    .header {
      background: #ffffff;
      color: #111111;
      border-bottom: 3px solid #0b3b78;
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .telstar-svg {
      height: 36px;
      width: auto;
      display: block;
    }
    .sub {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #0b3b78;
      text-transform: uppercase;
    }
    .counter {
      background: #0b3b78;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .bigbtn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #0078d4;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
    }
    .field-label {
      display: block;
      font-weight: 700;
      margin-top: 14px;
      margin-bottom: 6px;
      color: #0b3b78;
    }
    .input-nombre {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #cbd6e2;
      border-radius: 12px;
    }
    .action-trigger {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 2px solid #0078d4;
      border-radius: 12px;
      background: #eaf4fc;
      color: #005a9e;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .sign-trigger {
      border-color: #0b3b78;
      background: #edf2f9;
      color: #0b3b78;
    }
    .signature-box {
      margin-top: 14px;
      padding: 12px;
      border: 2px solid #0b3b78;
      border-radius: 14px;
      background: #f8fbff;
    }
    #canvasFirma {
      width: 100%;
      height: 200px;
      display: block;
      background: #fff;
      border: 2px dashed #9fb3c8;
      border-radius: 10px;
      touch-action: none;
    }
    .sign-preview {
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #d5e0ec;
      border-radius: 12px;
      background: #f9fbfe;
    }
    .sign-preview img {
      max-width: 100%;
      max-height: 120px;
      display: block;
      margin-top: 8px;
      background: #fff;
    }
    video {
      width: 100%;
      max-height: 420px;
      background: #111;
      border-radius: 14px;
      margin-top: 12px;
      display: block;
    }
    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .snap { background: #0078d4; }
    .save { background: #107c10; }
    .clear { background: #5c6b7c; }
    .close { background: #d83b01; }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .thumb-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #111;
    }
    .thumb-box img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block;
    }
    .thumb-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #c50f1f;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 3px 7px;
      font-weight: 700;
      cursor: pointer;
    }
    .accordion-toggle {
      width: 100%;
      background: #f4f7fb;
      border: 2px solid #d5e0ec;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
