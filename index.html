<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>TRANSPORTE INTERNO SYNTEGON TELSTAR</title>
<style>
body{margin:0;background:#eef3f8;font-family:Segoe UI,Arial}
.container{max-width:900px;margin:auto;padding:12px}
.header{background:#0b3b78;color:#fff;padding:20px;border-radius:18px;text-align:center}
.logo{font-size:34px;font-weight:900}
.bigbtn,.btn{width:100%;border:none;border-radius:14px;color:#fff;font-weight:700;cursor:pointer}
.bigbtn{padding:22px;background:#0078d4;font-size:24px}
.btn{padding:14px;margin-top:8px}
.green{background:#107c10}.red{background:#c50f1f}.blue{background:#0078d4}
.card{background:white;padding:16px;border-radius:16px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
canvas#firma{border:2px solid #ccc;border-radius:10px;width:100%;height:180px;touch-action:none}
.details{margin-top:10px}
.record img,.thumb{max-width:100%;border-radius:10px;margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
</style></head>
<body>
<div class="container">
<div class="header"><div class="logo">SYNTEGON</div><div>TRANSPORTE INTERNO TELSTAR</div><div id="contador">Registros hoy: 0</div></div>
<div class="card">
<button class="bigbtn" onclick="mostrarFormulario()">📷 NUEVO REGISTRO</button>
<div id="form" style="display:none;margin-top:12px">
<label>Proveedor / Cliente</label><input id="cliente" placeholder="Escribir nombre">
<p><b>Firma</b></p>
<canvas id="firma"></canvas>
<button class="btn red" onclick="limpiarFirma()">Borrar firma</button>
<input type="file" id="fotos" accept="image/*" capture="environment" multiple style="display:none">
<button class="btn blue" onclick="document.getElementById('fotos').click()">📷 Añadir foto(s)</button>
<div id="preview"></div>
<button class="btn green" onclick="guardarRegistro()">✅ Guardar registro</button>
</div></div>
<div class="card"><h3>Historial</h3><div id="historial"></div></div>
</div>
<script>
let fotos=[];
function mostrarFormulario(){document.getElementById('form').style.display='block'}
const canvas=document.getElementById('firma');const ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth;canvas.height=180;} resize(); window.onresize=resize;
let d=false;
function pos(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function start(e){d=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
function move(e){if(!d)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}
function end(){d=false}
canvas.addEventListener('mousedown',start);canvas.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
canvas.addEventListener('touchstart',start);canvas.addEventListener('touchmove',move);canvas.addEventListener('touchend',end);
function limpiarFirma(){ctx.clearRect(0,0,canvas.width,canvas.height)}
document.getElementById('fotos').addEventListener('change',e=>{for(const f of e.target.files){const r=new FileReader();r.onload=x=>{fotos.push(x.target.result);renderFotos()};r.readAsDataURL(f)}})
function renderFotos(){document.getElementById('preview').innerHTML=fotos.map(f=>`<img class="thumb" src="${f}">`).join('')}
function guardarRegistro(){const regs=JSON.parse(localStorage.getItem('regs')||'[]');const d=new Date();regs.push({cliente:cliente.value,fecha:d.toLocaleDateString('es-ES'),hora:d.toLocaleTimeString('es-ES'),firma:canvas.toDataURL(),fotos:[...fotos]});localStorage.setItem('regs',JSON.stringify(regs));cliente.value='';fotos=[];renderFotos();limpiarFirma();cargar();alert('Registro guardado');}
function borrar(i){if(!confirm('Borrar registro'))return;const r=JSON.parse(localStorage.getItem('regs')||'[]');r.splice(i,1);localStorage.setItem('regs',JSON.stringify(r));cargar();}
function cargar(){const r=JSON.parse(localStorage.getItem('regs')||'[]');const hoy=new Date().toLocaleDateString('es-ES');contador.innerText='Registros hoy: '+r.filter(x=>x.fecha===hoy).length;historial.innerHTML='';r.slice().reverse().forEach((x,idx)=>{const real=r.length-1-idx;historial.innerHTML+=`<details class="details"><summary><b>${x.fecha} ${x.hora}</b> - ${x.cliente||'Sin nombre'}</summary><div class="record"><p><b>Cliente/Proveedor:</b> ${x.cliente}</p><p><b>Firma:</b><br><img src="${x.firma}"></p>${x.fotos.map(f=>`<img src="${f}">`).join('')}<div class="row"><button class="btn red" onclick="borrar(${real})">🗑 Borrar</button></div></div></details>`})}
cargar();
</script></body></html>
